[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Fault‑Tolerant Distributed Compute Platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Atlas Contributors"}]
dependencies = [
    "SQLAlchemy>=2.0",
    "psycopg2-binary",
    "grpcio",
    "grpcio-tools",
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "pytest",
    "httpx",
    "alembic"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
